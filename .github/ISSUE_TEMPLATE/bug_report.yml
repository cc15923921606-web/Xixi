name: 问题反馈
description: 报告可以稳定复现的应用问题
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: 请先删除截图和日志中的 API 密钥、QQ 号、群号、真实姓名和本机用户名。
  - type: input
    id: version
    attributes:
      label: 昔夕版本
      placeholder: 例如 0.1
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows 版本
      placeholder: 例如 Windows 11 24H2 x64
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: 影响模块
      options:
        - 启动与安装
        - 模型与 API
        - 语音输入或通话
        - 本地语音合成
        - QQ
        - 图片或屏幕理解
        - 记忆与成长
        - 天气提醒
        - 界面
        - 其他
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 请写出从启动应用开始的完整操作顺序。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 已脱敏日志
      render: text
  - type: checkboxes
    id: privacy
    attributes:
      label: 隐私确认
      options:
        - label: 我已移除密钥、QQ 信息、聊天记录和个人路径
          required: true
