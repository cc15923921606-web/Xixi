name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Audit repository
        run: python scripts/audit_repository.py

      - name: Compile Python
        run: python -m compileall -q app scripts start_xixi_qq.py start_xixi_studio.py start_xixi_desktop.py

      - name: Run tests
        run: python -m unittest discover -s tests -p "test_*.py"

      - name: Check JavaScript syntax
        run: |
          node --check studio/app.js
          node --check studio/setup.js
          node --check studio/call_overlay.js
